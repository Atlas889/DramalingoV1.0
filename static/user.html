<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DramaLingo · 用影视学英语</title>
<style>
:root {
  --brand:#7B2FBE; --brand2:#C850C0; --gold:#E8A020;
  --bg:#f8f5ff; --card:#fff; --border:#ede9f8;
  --text:#1a1a2e; --muted:#8b7aad;
  --green:#16a34a; --blue:#2563eb; --orange:#d97706;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,#1e0535 0%,#4a1070 60%,#7B2FBE 100%);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 20px rgba(123,47,190,.4)}
.logo{display:flex;align-items:center;gap:10px}
.logo .ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#C850C0,#E8A020);display:flex;align-items:center;justify-content:center;font-size:16px}
.logo .ico .logo-img{width:100%;height:100%;object-fit:contain;display:block}
.logo .name{color:#fff;font-weight:800;font-size:16px}
.logo .tag{color:rgba(255,255,255,.5);font-size:11px;margin-left:4px}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-right a{color:rgba(255,255,255,.7);font-size:12px;text-decoration:none;padding:5px 10px;border-radius:7px;transition:all .15s}
.hdr-right a:hover{background:rgba(255,255,255,.15);color:#fff}
.hero{background:linear-gradient(135deg,#1e0535 0%,#4a1070 60%,#7B2FBE 100%);padding:40px 24px 52px;text-align:center}
.hero h1{color:#fff;font-size:28px;font-weight:900;margin-bottom:10px;line-height:1.3}
.hero h1 span{background:linear-gradient(135deg,#E8A020,#F5C842);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:rgba(255,255,255,.65);font-size:14px;margin-bottom:28px}
.search-wrap{max-width:680px;margin:0 auto;position:relative}
.search-box{display:flex;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.search-box input{flex:1;border:none;padding:14px 18px;font-size:15px;color:var(--text);outline:none;background:transparent}
.search-box input::placeholder{color:#aaa}
.search-box button{padding:12px 22px;background:linear-gradient(135deg,#7B2FBE,#C850C0);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.search-box button:hover{opacity:.9}
.filters-row{max-width:680px;margin:12px auto 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.75);background:rgba(255,255,255,.1);transition:all .15s;display:flex;align-items:center}
.filter-chip select{background:transparent;border:none;color:inherit;font-size:12px;font-weight:600;cursor:pointer;outline:none;padding:0 2px}
.filter-chip select option{color:var(--text);background:#fff}
.examples{max-width:680px;margin:14px auto 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.examples span{color:rgba(255,255,255,.5);font-size:12px}
.ex-tag{padding:4px 11px;border-radius:20px;font-size:12px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);cursor:pointer;border:1px solid rgba(255,255,255,.2);transition:all .15s}
.ex-tag:hover{background:rgba(255,255,255,.22);color:#fff}
.container{max-width:900px;margin:0 auto;padding:24px 16px 48px}
.search-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.search-meta .ml{font-size:13px;color:var(--muted)}
.search-meta .ml strong{color:var(--text)}
.search-meta .mr{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.search-meta select{border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-size:12px;outline:none;background:#fff}
.results-list{display:flex;flex-direction:column;gap:12px}
.rc{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:16px;box-shadow:0 1px 6px rgba(123,47,190,.05);transition:all .2s}
.rc:hover{border-color:#c4b5e8;box-shadow:0 4px 20px rgba(123,47,190,.12);transform:translateY(-1px)}
.rc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.rc-en{font-size:15px;font-weight:600;color:var(--text);line-height:1.5;flex:1}
.rc-score{flex-shrink:0;text-align:right}
.rc-score .pct{font-size:18px;font-weight:800;color:var(--brand)}
.rc-score .lbl{font-size:10px;color:var(--muted)}
.rc-zh{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.5;padding:8px 12px;background:#faf8ff;border-radius:8px;border-left:3px solid #e9d5ff}
.rc-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-show{background:#f3e8ff;color:#6b21a8}
.b-ep{background:#f1f5f9;color:#475569}
.b-time{background:#ecfdf5;color:#065f46;font-family:monospace;font-size:10px}
.b-beg{background:#dbeafe;color:#1d4ed8}
.b-int{background:#fef3c7;color:#92400e}
.b-adv{background:#fee2e2;color:#b91c1c}
.b-scene{background:#fdf4ff;color:#7e22ce}
.b-clip{background:#dcfce7;color:#15803d}
.b-mode{background:#f0fdf4;color:#15803d;font-size:10px}
.b-mode.kw{background:#fff7ed;color:#c2410c}
.rc-bottom{margin-top:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.rc-actions{display:flex;gap:6px}
.btn-copy{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--brand);transition:all .15s}
.btn-copy:hover{border-color:var(--brand);background:#f3ecff}
.vp{margin-top:12px;border-radius:10px;overflow:hidden;background:#000;display:none}
.vp video{width:100%;height:auto;display:block;aspect-ratio:16/9;object-fit:contain}
.vp-info{padding:7px 12px;background:#1a1a2e;color:rgba(255,255,255,.65);font-size:11px}
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;flex-wrap:wrap}
.pg-btn{padding:7px 14px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer;transition:all .15s;color:var(--text)}
.pg-btn:hover{border-color:var(--brand);color:var(--brand)}
.pg-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-info{font-size:13px;color:var(--muted)}
.state-box{text-align:center;padding:60px 24px;color:var(--muted)}
.state-box .si{font-size:48px;margin-bottom:14px}
.state-box .st{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.state-box .ss{font-size:13px}
.dots{display:inline-flex;gap:4px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:bonce .8s infinite}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes bonce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* ── 思考面板（搜索中） ── */
.thinking-panel{padding:32px 0 16px}
.thinking-hdr{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.thinking-brain{font-size:26px;animation:brain-pulse 1.4s ease-in-out infinite}
@keyframes brain-pulse{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
.thinking-title-txt{font-size:18px;font-weight:800;color:var(--text)}
.t-loading{display:inline-flex;gap:4px;align-items:center}
.t-loading span{width:5px;height:5px;border-radius:50%;background:var(--brand);animation:bonce .9s infinite}
.t-loading span:nth-child(2){animation-delay:.2s}
.t-loading span:nth-child(3){animation-delay:.4s}
.t-loading.sm span{width:4px;height:4px}
.t-steps{display:flex;flex-direction:column;padding-left:13px;border-left:2px solid #e9d5ff}
.t-step{display:flex;align-items:flex-start;gap:12px;padding:10px 0 10px 20px;opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease;position:relative}
.t-step.visible{opacity:1;transform:translateY(0)}
.ts-dot{width:10px;height:10px;border-radius:50%;background:#e9d5ff;position:absolute;left:-16px;top:14px;transition:background .3s,box-shadow .3s;flex-shrink:0}
.t-step.visible .ts-dot{background:var(--brand)}
.t-step.visible:last-child .ts-dot{background:var(--brand);box-shadow:0 0 0 4px rgba(123,47,190,.15);animation:dot-ring 1s ease infinite}
@keyframes dot-ring{0%,100%{box-shadow:0 0 0 4px rgba(123,47,190,.15)}50%{box-shadow:0 0 0 7px rgba(123,47,190,.07)}}
.ts-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.ts-val{font-size:14px;color:var(--text);line-height:1.6}
.ts-val em{color:var(--brand);font-style:normal;font-weight:600}

/* ── 思考摘要卡（结果顶部） ── */
.trace-card{background:linear-gradient(135deg,#faf5ff 0%,#f3e8ff 100%);border:1px solid #e2d5f5;border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 8px rgba(123,47,190,.07)}
.trace-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;user-select:none;transition:background .15s}
.trace-hdr:hover{background:rgba(123,47,190,.04)}
.trace-hdr-l{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--brand)}
.trace-hdr-r{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.trace-toggle{transition:transform .2s}
.trace-toggle.open{transform:rotate(180deg)}
.trace-body{padding:2px 16px 14px;border-top:1px solid #e9d5ff}
.trace-row{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed #ede9f8;font-size:12px}
.trace-row:last-child{border-bottom:none;padding-bottom:0}
.trace-lbl{font-weight:700;color:var(--muted);min-width:60px;flex-shrink:0}
.trace-rval{color:var(--text);line-height:1.7;flex:1}
.trace-rval em{color:var(--brand);font-style:normal;font-weight:600}
.trace-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.trace-pill{padding:2px 9px;border-radius:11px;font-size:11px;background:#fff;border:1px solid #ddd6f5;color:var(--brand);font-weight:500}
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.ti{padding:10px 15px;border-radius:10px;font-size:12px;font-weight:600;color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:sli .3s ease}
.ti.s{background:linear-gradient(135deg,#16a34a,#22c55e)}
.ti.e{background:linear-gradient(135deg,#dc2626,#ef4444)}
.ti.i{background:linear-gradient(135deg,#7B2FBE,#C850C0)}
@keyframes sli{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
/* ── 视频缩略图 / 播放按钮（U4：默认折叠） ── */
.vp-thumb{position:relative;width:100%;aspect-ratio:16/9;background:#0f0620;border-radius:8px;overflow:hidden;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center}
.vp-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vp-thumb .vp-play{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(123,47,190,.85);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;transition:transform .15s,background .15s;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.vp-thumb:hover .vp-play{transform:scale(1.12);background:rgba(123,47,190,1)}
.vp-thumb .vp-dur{position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-family:monospace}
@media(max-width:600px){.hero h1{font-size:20px}.rc-en{font-size:13px}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="ico"><img class="logo-img" src="/static/logo.png" alt="DramaLingo"></div>
    <div class="name">DramaLingo</div>
    <span class="tag">用影视学英语</span>
  </div>
  <div class="hdr-right">
    <a href="#" onclick="toggleHistory(event)" title="搜索历史">📖 历史</a>
  </div>
</header>
<div class="hero">
  <h1>从影视台词中<span>学地道英语</span></h1>
  <p>输入中文意思或英文关键词，AI 帮你找到最贴切的影视台词</p>
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="q" placeholder="输入中文意思或英文关键词，如「表达感激」「I'm sorry」" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">🔍 搜索</button>
    </div>
  </div>
  <div class="filters-row">
    <div class="filter-chip">
      <select id="f-diff" onchange="doSearch()">
        <option value="">全部难度</option>
        <option value="beginner">🟢 入门</option>
        <option value="intermediate">🟡 进阶</option>
        <option value="advanced">🔴 挑战</option>
      </select>
    </div>
    <div class="filter-chip">
      <select id="f-scene" onchange="doSearch()">
        <option value="">全部场景</option>
        <option value="daily">日常生活</option>
        <option value="work">职场商务</option>
        <option value="romance">情感关系</option>
        <option value="conflict">冲突对抗</option>
        <option value="humor">幽默玩笑</option>
      </select>
    </div>
    <div class="filter-chip">
      <select id="f-clip" onchange="doSearch()">
        <option value="">全部</option>
        <option value="true">🎬 有视频切片</option>
      </select>
    </div>
    <div class="filter-chip">
      <select id="f-limit" onchange="doSearch()">
        <option value="20">每页 20 条</option>
        <option value="30">每页 30 条</option>
        <option value="50">每页 50 条</option>
      </select>
    </div>
  </div>
  <div class="examples">
    <span>试试：</span>
    <span class="ex-tag" onclick="sq('表达感激')">表达感激</span>
    <span class="ex-tag" onclick="sq('道歉')">道歉</span>
    <span class="ex-tag" onclick="sq('鼓励朋友')">鼓励朋友</span>
    <span class="ex-tag" onclick="sq('拒绝邀请')">拒绝邀请</span>
    <span class="ex-tag" onclick="sq('表白心意')">表白心意</span>
    <span class="ex-tag" onclick="sq('I love you')">I love you</span>
    <span class="ex-tag" onclick="sq('hope')">hope</span>
    <span class="ex-tag" onclick="sq('friendship')">friendship</span>
  </div>
</div>
<div class="container">
  <div class="search-meta" id="smeta" style="display:none">
    <div class="ml">搜索 "<strong id="m-q"></strong>"，找到 <strong id="m-total"></strong> 条结果 <span id="m-mode"></span></div>
    <div class="mr">排序：<select id="sort" onchange="rerender()"><option value="sim">最相关</option><option value="rank">综合排序</option><option value="quality">最地道</option></select></div>
  </div>
  <div id="rc-wrap">
    <div class="state-box" id="init-state">
      <div class="si">🎬</div>
      <div class="st">开始你的英语学习之旅</div>
      <div class="ss">输入中文意思或英文关键词，从经典影视中找到最地道的表达</div>
    </div>
  </div>
  <div class="pagination" id="pager" style="display:none"></div>
</div>
<div id="toast"></div>
<script>
const API='';
let allResults=[],curQ='',curPage=1,curTotal=0,curLimit=20;
let lastSearchMeta=null,_thinkTimers=[];
let _searchHistory=JSON.parse(localStorage.getItem('dl_history')||'[]');

function toast(msg,type='i'){
  const el=document.createElement('div');
  el.className=`ti ${type}`;el.textContent=msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(),3000);
}
function sq(q){document.getElementById('q').value=q;doSearch();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escA(s){return String(s||'').replace(/'/g,"\\'").replace(/\n/g,' ');}
function fmtT(sec){
  if(sec==null)return '—';
  const m=Math.floor(sec/60),s=(sec%60).toFixed(1);
  return `${m}:${String(s).padStart(4,'0')}`;
}

function clearThinkTimers(){_thinkTimers.forEach(clearTimeout);_thinkTimers=[];}

function showThinking(q){
  clearThinkTimers();
  const steps=[
    {label:'理解意图',val:`分析"<em>${esc(q)}</em>"的语义与场景`},
    {label:'语义补全',val:'调用 AI 生成丰富的中文描述'},
    {label:'候选翻译',val:'生成多条地道英文表达候选'},
    {label:'向量检索',val:'多路信号并行检索知识库'},
  ];
  const stepsHtml=steps.map((_,i)=>`
    <div class="t-step" id="tstep-${i}">
      <span class="ts-dot"></span>
      <div><div class="ts-label">${esc(steps[i].label)}</div><div class="ts-val">${steps[i].val}</div></div>
    </div>`).join('');
  document.getElementById('rc-wrap').innerHTML=`
    <div class="thinking-panel">
      <div class="thinking-hdr">
        <span class="thinking-brain">🧠</span>
        <span class="thinking-title-txt">正在思考</span>
        <span class="t-loading"><span></span><span></span><span></span></span>
      </div>
      <div class="t-steps">${stepsHtml}</div>
    </div>`;
  steps.forEach((_,i)=>{
    const tid=setTimeout(()=>{
      const el=document.getElementById(`tstep-${i}`);
      if(el)el.classList.add('visible');
    },i*550);
    _thinkTimers.push(tid);
  });
}


async function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(!q)return;
  curQ=q;curPage=1;lastSearchMeta=null;
  curLimit=parseInt(document.getElementById('f-limit').value)||20;
  // 记录搜索历史（localStorage，最近20条去重）
  _searchHistory=_searchHistory.filter(h=>h!==q);
  _searchHistory.unshift(q);
  if(_searchHistory.length>20)_searchHistory.pop();
  localStorage.setItem('dl_history',JSON.stringify(_searchHistory));
  await fetchResults();
}

async function fetchResults(){
  const q=curQ;
  if(!q)return;
  const t0=Date.now();
  showThinking(q);
  document.getElementById('smeta').style.display='none';
  document.getElementById('pager').style.display='none';
  const offset=(curPage-1)*curLimit;
  const params=new URLSearchParams({q,limit:curLimit,offset});
  const diff=document.getElementById('f-diff').value;
  const scene=document.getElementById('f-scene').value;
  const clip=document.getElementById('f-clip').value;
  if(diff)params.set('difficulty',diff);
  if(scene)params.set('scene',scene);
  if(clip)params.set('has_clip',clip);
  try{
    const r=await fetch(`${API}/search?${params}`);
    const d=await r.json();
    clearThinkTimers();
    const elapsed=Date.now()-t0;
    allResults=d.results||[];
    curTotal=d.total||allResults.length;  // API 返回的命中总数（分页前），用于渲染页码
    lastSearchMeta={
      query:q,
      expanded_zh:d.expanded_zh||null,
      candidate_en:d.candidate_en||[],
      detected_scene:d.detected_scene||null,
      detected_emotion:d.detected_emotion||null,
      from_cache:d.from_cache||false,
      search_mode:d.search_mode||'',
      elapsed_ms:elapsed,
    };
    document.getElementById('m-q').textContent=q;
    document.getElementById('m-total').textContent=curTotal;
    const mode=d.search_mode||'';
    const mEl=document.getElementById('m-mode');
    mEl.innerHTML=mode?`<span class="badge b-mode ${mode==='keyword_fallback'?'kw':''}">${mode==='keyword_fallback'?'关键词匹配':'语义检索'}</span>`:'';
    document.getElementById('smeta').style.display='flex';
    if(!allResults.length){
      document.getElementById('rc-wrap').innerHTML=`
        <div class="state-box">
          <div class="si">🔍</div>
          <div class="st">未找到相关结果</div>
          <div class="ss">试试其他关键词，或调整难度/场景筛选条件</div>
        </div>`;
      return;
    }
    rerender();
  }catch(e){
    clearThinkTimers();
    document.getElementById('rc-wrap').innerHTML=`
      <div class="state-box">
        <div class="si">⚠️</div>
        <div class="st">搜索失败</div>
        <div class="ss">${esc(e.message)}</div>
      </div>`;
  }
}

function toggleTrace(){
  const body=document.getElementById('trace-body');
  const arrow=document.getElementById('trace-arrow');
  if(!body)return;
  const open=body.style.display!=='none';
  body.style.display=open?'none':'block';
  if(arrow)arrow.className='trace-toggle'+(open?'':' open');
}

function renderTraceCard(meta){
  if(!meta||meta.search_mode==='keyword_fallback')return '';
  const sceneMap={daily:'日常生活',work:'职场商务',romance:'情感关系',conflict:'冲突对抗',humor:'幽默玩笑'};
  const emotionMap={happy:'开心',sad:'悲伤',angry:'愤怒',surprised:'惊讶'};
  const elapsedSec=(meta.elapsed_ms/1000).toFixed(2);
  const cacheTag=meta.from_cache?'<span class="trace-pill" style="background:#f0fdf4;border-color:#bbf7d0;color:#15803d">⚡ 缓存命中</span>':'';
  let enPills='';
  if(meta.candidate_en&&meta.candidate_en.length){
    enPills=`<div class="trace-pills">${meta.candidate_en.map(e=>`<span class="trace-pill">${esc(e)}</span>`).join('')}</div>`;
  }
  let tagRow='';
  if(meta.detected_scene||meta.detected_emotion){
    const parts=[];
    if(meta.detected_scene)parts.push(`<span class="trace-pill">${esc(sceneMap[meta.detected_scene]||meta.detected_scene)}</span>`);
    if(meta.detected_emotion)parts.push(`<span class="trace-pill">${esc(emotionMap[meta.detected_emotion]||meta.detected_emotion)}</span>`);
    tagRow=`<div class="trace-row">
      <span class="trace-lbl">意图标签</span>
      <div class="trace-rval"><div class="trace-pills">${parts.join('')}</div></div>
    </div>`;
  }
  const expandedRow=meta.expanded_zh?`<div class="trace-row">
    <span class="trace-lbl">语义补全</span>
    <div class="trace-rval"><em>${esc(meta.expanded_zh)}</em></div>
  </div>`:'';
  const enRow=enPills?`<div class="trace-row">
    <span class="trace-lbl">候选英文</span>
    <div class="trace-rval">${enPills}</div>
  </div>`:'';
  return `<div class="trace-card">
    <div class="trace-hdr" onclick="toggleTrace()">
      <div class="trace-hdr-l">🧠 AI 思考过程</div>
      <div class="trace-hdr-r">${cacheTag}<span>耗时 ${elapsedSec}s</span><span class="trace-toggle open" id="trace-arrow">▾</span></div>
    </div>
    <div class="trace-body" id="trace-body">
      ${expandedRow}${enRow}${tagRow}
    </div>
  </div>`;
}

function rerender(){
  const sort=document.getElementById('sort').value;
  let res=[...allResults];
  // 默认按相似度降序；综合排序保持 API 返回顺序；质量分降序
  if(sort==='quality')res.sort((a,b)=>(b.quality_score||0)-(a.quality_score||0));
  else if(sort==='rank'){/* 保持 API 顺序 */}
  else res.sort((a,b)=>(b.similarity||0)-(a.similarity||0)); // sim（默认）
  const wrap=document.getElementById('rc-wrap');
  const traceHtml=lastSearchMeta?renderTraceCard(lastSearchMeta):'';
  wrap.innerHTML=traceHtml+`<div class="results-list">${res.map((it,i)=>renderCard(it,i)).join('')}</div>`;
  const totalPages=Math.ceil(curTotal/curLimit);
  if(totalPages>1){renderPager(curPage,totalPages);document.getElementById('pager').style.display='flex';}
  else document.getElementById('pager').style.display='none';
}

function simStars(sim){
  // 将相似度 0~1 转为 1~5 星（最低 0.5 → 1星，0.9+ → 5星）
  const s=Math.min(5,Math.max(1,Math.round((sim-0.4)/0.12)));
  return '★'.repeat(s)+'☆'.repeat(5-s);
}
function renderCard(it,idx){
  const sim=it.similarity||0;
  const simPct=Math.round(sim*100);
  const diffMap={beginner:['b-beg','🟢 入门'],intermediate:['b-int','🟡 进阶'],advanced:['b-adv','🔴 挑战']};
  const [dc,dl]=diffMap[it.difficulty]||['',''];
  const sceneMap={daily:'日常',work:'职场',romance:'情感',conflict:'冲突',humor:'幽默'};
  const dur=it.start_time!=null&&it.end_time!=null?((it.end_time-it.start_time).toFixed(1)+'s'):'';
  // 视频折叠：首条结果（idx===0）自动展开，其余折叠
  const hasVP=it.has_clip&&it.clip&&it.clip.stream_url;
  const vpOpen=hasVP&&idx===0;
  const clipDur=it.clip?.duration?`${it.clip.duration.toFixed(1)}s`:'';
  return `
    <div class="rc" id="rc-${idx}">
      <div class="rc-top">
        <div class="rc-en">${esc(it.en_text||'')}</div>
        <div class="rc-score">
          <div class="pct" title="${simPct}% 匹配度" style="font-size:15px;letter-spacing:-1px;color:var(--gold)">${simStars(sim)}</div>
          <div class="lbl">匹配度</div>
        </div>
      </div>
      ${it.zh_text?`<div class="rc-zh">${esc(it.zh_text)}</div>`:''}
      <div class="rc-meta">
        <span class="badge b-show">🎬 ${esc(it.show_name||'')}</span>
        <span class="badge b-ep">${esc(it.episode||'')}</span>
        <span class="badge b-time">⏱ ${fmtT(it.start_time)} → ${fmtT(it.end_time)}${dur?' ('+dur+')':''}</span>
        ${dc?`<span class="badge ${dc}">${dl}</span>`:''}
        ${it.scene?`<span class="badge b-scene">${sceneMap[it.scene]||it.scene}</span>`:''}
        ${it.has_clip?`<span class="badge b-clip">🎬 有视频</span>`:''}
      </div>
      <div class="rc-bottom">
        <div></div>
        <div class="rc-actions">
          <button class="btn-copy" onclick="copyTxt('${escA(it.en_text||'')}')">📋 复制</button>
        </div>
      </div>
      ${hasVP?`
        <div class="vp-thumb" onclick="toggleVP(${idx})" id="vpthumb-${idx}" style="display:${vpOpen?'none':'flex'}">
          ${it.clip.thumb_url?`<img src="${esc(it.clip.thumb_url)}" onerror="this.style.display='none'" alt="预览">`:''}
          <div class="vp-play">▶</div>
          ${clipDur?`<span class="vp-dur">${clipDur}</span>`:''}
        </div>
        <div class="vp" id="vp-${idx}" style="display:${vpOpen?'block':'none'}">
          <video controls preload="metadata" src="${esc(it.clip.stream_url)}"></video>
          <div class="vp-info">📍 ${esc(it.show_name)} ${esc(it.episode||'')} · ${fmtT(it.start_time)} - ${fmtT(it.end_time)}
            <span style="margin-left:8px;cursor:pointer;opacity:.7" onclick="toggleVP(${idx})">▲ 收起</span>
          </div>
        </div>`:''}
    </div>`;
}


function toggleVP(idx){
  const vp=document.getElementById(`vp-${idx}`);
  const thumb=document.getElementById(`vpthumb-${idx}`);
  if(!vp)return;
  const open=vp.style.display==='block';
  vp.style.display=open?'none':'block';
  if(thumb)thumb.style.display=open?'flex':'none';
}

function toggleHistory(e){
  e.preventDefault();
  let panel=document.getElementById('hist-panel');
  if(panel){panel.remove();return;}
  if(!_searchHistory.length){toast('暂无搜索历史','i');return;}
  panel=document.createElement('div');
  panel.id='hist-panel';
  panel.style.cssText='position:fixed;top:56px;right:12px;z-index:800;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);min-width:200px;max-width:280px;padding:10px 0;';
  panel.innerHTML=`<div style="padding:6px 14px 8px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border)">最近搜索</div>`
    +_searchHistory.map(h=>`<div style="padding:8px 14px;font-size:13px;cursor:pointer;transition:background .12s" onmouseover="this.style.background='#f5f0ff'" onmouseout="this.style.background=''" onclick="sq('${escA(h)}');document.getElementById('hist-panel')?.remove()">${esc(h)}</div>`).join('')
    +`<div style="padding:6px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);cursor:pointer" onclick="_searchHistory=[];localStorage.removeItem('dl_history');document.getElementById('hist-panel')?.remove();toast('历史已清空','i')">🗑 清空历史</div>`;
  document.body.appendChild(panel);
  setTimeout(()=>document.addEventListener('click',function h(ev){if(!panel.contains(ev.target)){panel.remove();document.removeEventListener('click',h);}},10));
}

function copyTxt(text){
  navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板','s')).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    toast('已复制','s');
  });
}

function renderPager(page,totalPages){
  const el=document.getElementById('pager');
  let h=`<span class="pg-info">第 ${page}/${totalPages} 页，共 ${curTotal} 条</span>`;
  h+=`<button class="pg-btn" onclick="goPage(${page-1})" ${page<=1?'disabled':''}>‹ 上一页</button>`;
  const s=Math.max(1,page-2),e=Math.min(totalPages,page+2);
  for(let i=s;i<=e;i++)h+=`<button class="pg-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  h+=`<button class="pg-btn" onclick="goPage(${page+1})" ${page>=totalPages?'disabled':''}>下一页 ›</button>`;
  el.innerHTML=h;
}

function goPage(page){
  if(page<1)return;
  curPage=page;
  fetchResults();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('q').focus();
});
</script>
</body>
</html>
